<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FREE FIRE SENSI</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;
    background:
        radial-gradient(circle at 50% 0%,#302000 0%,#100b03 35%,#050505 75%);
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:480px;
}

.logo{
    text-align:center;
    font-size:38px;
    font-weight:900;
    letter-spacing:3px;
    color:#ffb300;
    text-shadow:
        0 0 8px #ff8c00,
        0 0 25px #ff6500;
    margin-bottom:6px;
}

.subtitle{
    text-align:center;
    color:#aaa;
    font-size:13px;
    margin-bottom:25px;
    letter-spacing:1px;
}

.card{
    background:rgba(15,15,15,.94);
    border:1px solid #3a2a0c;
    border-radius:20px;
    padding:24px;
    box-shadow:
        0 0 30px rgba(255,145,0,.12),
        inset 0 0 20px rgba(255,145,0,.025);
}

label{
    display:block;
    color:#ddd;
    font-size:13px;
    margin-bottom:8px;
}

input{
    width:100%;
    padding:15px;
    border-radius:12px;
    border:1px solid #4b350d;
    background:#090909;
    color:white;
    outline:none;
    font-size:16px;
    margin-bottom:14px;
}

input:focus{
    border-color:#ff9d00;
    box-shadow:0 0 12px rgba(255,157,0,.25);
}

button{
    width:100%;
    padding:15px;
    border:0;
    border-radius:12px;
    background:linear-gradient(90deg,#ff7a00,#ffb300);
    color:#111;
    font-weight:900;
    font-size:16px;
    cursor:pointer;
    transition:.2s;
}

button:hover{
    transform:translateY(-2px);
    box-shadow:0 5px 20px rgba(255,150,0,.35);
}

button:active{
    transform:scale(.98);
}

.result{
    display:none;
    margin-top:20px;
}

.phone{
    text-align:center;
    color:#ffb300;
    font-size:18px;
    font-weight:bold;
    margin-bottom:16px;
}

.sensi-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.sensi{
    background:#0a0a0a;
    border:1px solid #29200c;
    border-radius:14px;
    padding:14px;
    text-align:center;
}

.sensi span{
    display:block;
    color:#999;
    font-size:12px;
    margin-bottom:7px;
}

.sensi strong{
    color:#ffad00;
    font-size:25px;
}

.full{
    grid-column:1 / -1;
}

.copy{
    margin-top:15px;
    background:#17120a;
    color:#ffb300;
    border:1px solid #49330c;
}

.copy:hover{
    background:#211a0d;
    color:#ffc34d;
}

.reset{
    margin-top:8px;
    background:#111;
    color:#aaa;
    border:1px solid #292929;
}

.footer{
    text-align:center;
    color:#555;
    font-size:11px;
    margin-top:16px;
}

.warning{
    display:none;
    color:#ffcc66;
    font-size:12px;
    text-align:center;
    margin-top:12px;
}

@media(max-width:380px){
    .logo{
        font-size:31px;
    }

    .sensi strong{
        font-size:21px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">FREE FIRE</div>
    <div class="subtitle">SENSI GENERATOR</div>

    <div class="card">

        <div id="searchBox">

            <label>ENTER YOUR PHONE MODEL</label>

            <input
                id="phoneInput"
                type="text"
                placeholder="Example: Samsung Galaxy A54 5G"
                autocomplete="off"
            >

            <button onclick="generateSensi()">
                GET SENSI 🔥
            </button>

            <div class="warning" id="warning">
                Please enter your phone model.
            </div>

        </div>

        <div class="result" id="result">

            <div class="phone" id="phoneName"></div>

            <div class="sensi-grid">

                <div class="sensi">
                    <span>GENERAL</span>
                    <strong id="general">--</strong>
                </div>

                <div class="sensi">
                    <span>RED DOT</span>
                    <strong id="redDot">--</strong>
                </div>

                <div class="sensi">
                    <span>2X SCOPE</span>
                    <strong id="scope2">--</strong>
                </div>

                <div class="sensi">
                    <span>4X SCOPE</span>
                    <strong id="scope4">--</strong>
                </div>

                <div class="sensi">
                    <span>SNIPER</span>
                    <strong id="sniper">--</strong>
                </div>

                <div class="sensi">
                    <span>FREE LOOK</span>
                    <strong id="freeLook">--</strong>
                </div>

                <div class="sensi full">
                    <span>DPI</span>
                    <strong id="dpi">--</strong>
                </div>

                <div class="sensi full">
                    <span>FIRE BUTTON</span>
                    <strong id="fire">--</strong>
                </div>

            </div>

            <button class="copy" onclick="copySensi()">
                COPY ALL SENSI
            </button>

            <button class="reset" onclick="resetGenerator()">
                CHANGE PHONE
            </button>

        </div>

    </div>

    <div class="footer">
        Fan-made Free Fire sensitivity tool
    </div>

</div>

<script>

/*
========================================
PHONE SENSI DATABASE
========================================
*/

const phones = {

    "samsung galaxy a54 5g":{
        general:196,
        redDot:188,
        scope2:180,
        scope4:169,
        sniper:82,
        freeLook:190,
        dpi:480,
        fire:48
    },

    "samsung galaxy a55":{
        general:194,
        redDot:186,
        scope2:178,
        scope4:168,
        sniper:80,
        freeLook:188,
        dpi:480,
        fire:48
    },

    "samsung galaxy s23":{
        general:190,
        redDot:184,
        scope2:175,
        scope4:165,
        sniper:78,
        freeLook:185,
        dpi:500,
        fire:47
    },

    "samsung galaxy s24":{
        general:191,
        redDot:185,
        scope2:176,
        scope4:166,
        sniper:79,
        freeLook:186,
        dpi:500,
        fire:47
    },

    "iphone 11":{
        general:188,
        redDot:181,
        scope2:173,
        scope4:163,
        sniper:76,
        freeLook:180,
        dpi:"Default",
        fire:47
    },

    "iphone 12":{
        general:190,
        redDot:183,
        scope2:175,
        scope4:165,
        sniper:77,
        freeLook:182,
        dpi:"Default",
        fire:47
    },

    "iphone 13":{
        general:191,
        redDot:184,
        scope2:176,
        scope4:166,
        sniper:78,
        freeLook:183,
        dpi:"Default",
        fire:48
    },

    "iphone 14":{
        general:192,
        redDot:185,
        scope2:177,
        scope4:167,
        sniper:79,
        freeLook:184,
        dpi:"Default",
        fire:48
    },

    "iphone 15":{
        general:193,
        redDot:186,
        scope2:178,
        scope4:168,
        sniper:80,
        freeLook:185,
        dpi:"Default",
        fire:48
    },

    "redmi note 12":{
        general:196,
        redDot:188,
        scope2:179,
        scope4:168,
        sniper:80,
        freeLook:190,
        dpi:480,
        fire:49
    },

    "redmi note 13":{
        general:197,
        redDot:189,
        scope2:180,
        scope4:169,
        sniper:81,
        freeLook:191,
        dpi:480,
        fire:49
    },

    "poco x3 pro":{
        general:198,
        redDot:190,
        scope2:181,
        scope4:170,
        sniper:82,
        freeLook:192,
        dpi:490,
        fire:49
    },

    "poco x6":{
        general:197,
        redDot:189,
        scope2:180,
        scope4:169,
        sniper:81,
        freeLook:191,
        dpi:490,
        fire:49
    },

    "realme c55":{
        general:194,
        redDot:186,
        scope2:178,
        scope4:167,
        sniper:79,
        freeLook:188,
        dpi:480,
        fire:48
    },

    "oneplus 11":{
        general:191,
        redDot:184,
        scope2:176,
        scope4:166,
        sniper:78,
        freeLook:184,
        dpi:500,
        fire:47
    }

};


/*
========================================
NORMALIZE TEXT
========================================
*/

function normalize(text){

    return text
        .toLowerCase()
        .trim()
        .replace(/\s+/g," ");

}


/*
========================================
GENERATE SENSI
========================================
*/

function generateSensi(){

    const input =
        document.getElementById("phoneInput");

    const warning =
        document.getElementById("warning");

    const result =
        document.getElementById("result");

    let model =
        normalize(input.value);

    if(model === ""){

        warning.style.display = "block";
        result.style.display = "none";

        return;
    }

    warning.style.display = "none";

    let data = phones[model];

    /*
    If phone is not in database,
    create a balanced profile automatically.
    */

    if(!data){

        const hash =
            model.split("")
            .reduce((a,c)=>
                ((a<<5)-a)+c.charCodeAt(0),0);

        const random =
            Math.abs(hash);

        data = {

            general:190 + (random % 9),

            redDot:180 + (random % 9),

            scope2:172 + (random % 9),

            scope4:162 + (random % 9),

            sniper:75 + (random % 10),

            freeLook:180 + (random % 11),

            dpi:460 + (random % 51),

            fire:45 + (random % 6)

        };

    }

    document.getElementById("phoneName")
        .textContent =
        input.value.toUpperCase();

    document.getElementById("general")
        .textContent = data.general;

    document.getElementById("redDot")
        .textContent = data.redDot;

    document.getElementById("scope2")
        .textContent = data.scope2;

    document.getElementById("scope4")
        .textContent = data.scope4;

    document.getElementById("sniper")
        .textContent = data.sniper;

    document.getElementById("freeLook")
        .textContent = data.freeLook;

    document.getElementById("dpi")
        .textContent = data.dpi;

    document.getElementById("fire")
        .textContent = data.fire + "%";

    document.getElementById("searchBox")
        .style.display = "none";

    result.style.display = "block";

}


/*
========================================
COPY SENSI
========================================
*/

function copySensi(){

    const phone =
        document.getElementById("phoneName").textContent;

    const text =

`FREE FIRE SENSI

Phone: ${phone}

General: ${document.getElementById("general").textContent}
Red Dot: ${document.getElementById("redDot").textContent}
2X Scope: ${document.getElementById("scope2").textContent}
4X Scope: ${document.getElementById("scope4").textContent}
Sniper: ${document.getElementById("sniper").textContent}
Free Look: ${document.getElementById("freeLook").textContent}
DPI: ${document.getElementById("dpi").textContent}
Fire Button: ${document.getElementById("fire").textContent}`;

    navigator.clipboard.writeText(text)
        .then(()=>{

            const button =
                document.querySelector(".copy");

            const old =
                button.textContent;

            button.textContent =
                "COPIED ✓";

            setTimeout(()=>{

                button.textContent = old;

            },1500);

        });

}


/*
========================================
RESET
========================================
*/

function resetGenerator(){

    document.getElementById("result")
        .style.display = "none";

    document.getElementById("searchBox")
        .style.display = "block";

    document.getElementById("phoneInput")
        .value = "";

    document.getElementById("phoneInput")
        .focus();

}


/*
========================================
ENTER KEY
========================================
*/

document.getElementById("phoneInput")
    .addEventListener("keydown",function(event){

        if(event.key === "Enter"){

            generateSensi();

        }

    });

</script>

</body>
</html>
